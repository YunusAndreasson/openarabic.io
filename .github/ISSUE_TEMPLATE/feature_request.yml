name: Feature request
description: Something the site should do, or do differently.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do on the site, and where it got in the way. A real situation helps more than a feature name.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How you picture it working.
  - type: markdown
    attributes:
      value: >
        The site only promotes the app and shows its texts and dictionary, so
        it won't get accounts or sign-up (CONTRIBUTING.md has the rest).
        Ideas for the app go to
        [YunusAndreasson/openarabic](https://github.com/YunusAndreasson/openarabic/issues).
